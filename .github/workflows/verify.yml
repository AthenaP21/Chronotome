name: Verify Chronotome

on:
  pull_request:
  push:
    branches:
      - main

# The workflow reads source only and deliberately receives no write token or secrets.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install wheel-only dependencies and the local package
        run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Run regression tests
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: python -m unittest discover -s tests -q
      - name: Check dependency consistency
        run: python -m pip check
